<style>
    .toast {
        position: fixed;
        right: 18px;
        bottom: 96px;
        z-index: 80;
    }

    .toastInner {
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 12px 14px;
        border-radius: 16px;
        color: rgba(255, 255, 255, 0.85);
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.08),
            0 18px 55px rgba(0, 0, 0, 0.55);
        max-width: 360px;
        font-size: 12px;
        line-height: 1.4;
    }

    /* Sidebar animation */
    .sidebar {
        right: -520px;
    }

    .sidebar.open {
        right: 0;
    }
</style>

<!-- Sidebar Intake -->
<aside id="sidebar"
    class="sidebar fixed top-0 transition-[right] duration-200 ease-out w-[460px] max-w-[92vw] h-screen bg-[#0e1a24] border-l border-white/10 shadow-soft z-[60] flex flex-col">
    <div class="p-5 border-b border-white/10 flex items-start justify-between gap-3">
        <div>
            <h4 id="sideTitle" class="m-0 text-[18px] font-extrabold text-white">
                Let’s Build Something Powerful.
            </h4>
            <p id="sideSub" class="mt-1 text-[13px] text-muted3 leading-relaxed">
                Tell us a little about what you need. We’ll recommend the best next step.
            </p>
        </div>
        <button id="closeSidebar"
            class="w-10 h-10 rounded-2xl border border-white/10 bg-white/5 grid place-items-center hover:bg-white/10 transition"
            type="button" aria-label="Close">
            ✕
        </button>
    </div>

    <div class="p-5 overflow-auto pb-20">
        <div class="space-y-6" data-step="0">
            <div class="field">
                <label class="block text-[13px] font-extrabold mb-2 text-white/90">1. Name</label>
                <input id="fName"
                    class="w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3.5 text-[14px] outline-none focus:border-brand/40 transition"
                    placeholder="Full name" />
            </div>

            <div class="field">
                <label class="block text-[13px] font-extrabold mb-2 text-white/90">2. Email or WhatsApp</label>
                <input id="fEmail" type="text"
                    class="w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3.5 text-[14px] outline-none focus:border-brand/40 transition"
                    placeholder="name@org.com or +255..." />
            </div>

            <div class="field">
                <label class="block text-[13px] font-extrabold mb-2 text-white/90">3. What are you trying to
                    achieve?</label>
                <textarea id="fObjective" rows="4"
                    class="w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3.5 text-[14px] outline-none focus:border-brand/40 transition resize-none placeholder-white/30"
                    placeholder="&quot;We’re launching a campaign...&quot;&#10;&quot;We need video production support...&quot;&#10;&quot;We want to increase signups by 30%...&quot;"></textarea>
            </div>

            <div class="field">
                <label class="block text-[13px] font-extrabold mb-2 text-white/90">4. When do you need this?</label>
                <select id="fTimeframe"
                    class="w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3.5 text-[14px] text-white outline-none focus:border-brand/40 transition appearance-none">
                    <option value="" disabled selected>Select timeframe…</option>
                    <option value="asap">ASAP</option>
                    <option value="1mo">Within 1 month</option>
                    <option value="3mo">1–3 months</option>
                    <option value="explore">Just exploring</option>
                </select>
            </div>

            <div class="field">
                <label class="block text-[13px] font-extrabold mb-2 text-white/90">5. Estimated budget
                    (optional)</label>
                <select id="fBudget"
                    class="w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3.5 text-[14px] text-white outline-none focus:border-brand/40 transition appearance-none">
                    <option value="" disabled selected>Select budget band…</option>
                    <option value="lt5">Under $5K</option>
                    <option value="5-20">$5K–$20K</option>
                    <option value="20-50">$20K–$50K</option>
                    <option value="50+">$50K+</option>
                    <option value="none">Prefer not to say</option>
                </select>
            </div>

        </div>

        <div class="mt-8">
            <button id="btnSubmit"
                class="w-full flex items-center justify-center rounded-xl bg-brand px-4 py-4 text-[14px] font-extrabold text-black shadow-[0_8px_24px_rgba(242,181,29,0.35)] hover:-translate-y-0.5 hover:bg-brand/90 transition"
                type="button">
                Tell Us About Your Project
            </button>
        </div>
    </div>
</aside>

<!-- Toast -->
<div id="toast" class="toast hidden" aria-live="polite">
    <div class="toastInner" id="toastText"></div>
</div>
